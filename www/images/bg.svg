<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft diagonal gradient: light teal -> soft lavender -> pale coral tint -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f9f6"/>          <!-- very light teal -->
      <stop offset="45%" stop-color="#f3edff"/>         <!-- soft lavender -->
      <stop offset="100%" stop-color="#ffece5"/>        <!-- pale coral / warm tint -->
    </linearGradient>

    <!-- Gentle radial glow to add depth without overpowering -->
    <radialGradient id="centerGlow" cx="55%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Pastel translucent blobs for subtle uniqueness -->
    <radialGradient id="blobTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fe4dc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9fe4dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobLav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d5c6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d5c6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine noise texture pattern (very subtle) -->
    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
    </filter>

    <!-- Blur for the abstract blobs to keep them soft -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Base gradient fill -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>

  <!-- Subtle vignette / depth -->
  <rect width="1600" height="900" fill="url(#centerGlow)"/>

  <!-- Abstract softly blurred blobs -->
  <g filter="url(#softBlur)">
    <circle cx="280" cy="260" r="240" fill="url(#blobTeal)"/>
    <circle cx="1380" cy="600" r="300" fill="url(#blobLav)"/>
    <circle cx="860" cy="870" r="260" fill="url(#blobSun)"/>
  </g>

  <!-- Layered gentle wave shapes at bottom (very low opacity) -->
  <path d="M0,700 C260,640 520,760 800,700 C1080,640 1340,760 1600,690 L1600,900 L0,900 Z" fill="#ffffff" fill-opacity="0.28"/>
  <path d="M0,735 C260,675 520,795 800,740 C1080,685 1340,805 1600,725 L1600,900 L0,900 Z" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M0,770 C260,710 520,830 800,780 C1080,730 1340,840 1600,755 L1600,900 L0,900 Z" fill="#ffffff" fill-opacity="0.10"/>

  <!-- Ultra subtle noise to avoid banding -->
  <rect width="1600" height="900" opacity="0.25" filter="url(#noise)" style="mix-blend-mode:soft-light"/>
</svg>